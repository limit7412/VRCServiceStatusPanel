# 集約サーバーのデプロイ定義（仕様書 5.1、10）。
#
# 手順:
#   1. env.example.yml を env.yml へ複製して値を入れる
#   2. Layer を発行し、返ってきた ARN を YTDLP_LAYER_ARN へ入れる
#        backend/layer/build.sh <yt-dlpの版>
#        aws lambda publish-layer-version \
#          --layer-name vrc-service-status-panel-ytdlp \
#          --zip-file fileb://ytdlp-layer.zip \
#          --compatible-runtimes provided.al2023 \
#          --compatible-architectures arm64 \
#          --query LayerVersionArn --output text
#        export YTDLP_LAYER_ARN=arn:aws:lambda:...
#   3. npx serverless deploy --stage <ステージ>
#
# YTDLP_LAYER_ARN はプロセスの環境変数からしか読まない。
# env.yml は provider.environment、つまり Lambda の実行時の環境変数に
# なるものなので、デプロイ時にだけ要るこの値はそちらへ置かない。
# 未設定のまま deploy や package を実行すると、変数の解決で止まる。
# CI では GitHub の変数から export する（#8）。

service: vrc-service-status-panel

plugins:
  - serverless-plugin-scripts

custom:
  defaultStage: dev

  # yt-dlp と QuickJS を載せた Layer の ARN（仕様書 7.1）。
  #
  # Layer はこの定義では作らず、backend/layer/build.sh で作った zip を
  # publish-layer-version で発行し、その ARN を渡す形にしている。
  # 仕様書 12 で未決とされている二択のうち、別途発行して参照する側を採った。
  # 7.3 の再ビルドが「/config の版に合わせて発行し、版を記録する」という
  # 流れで、デプロイとは別の周期で動くためである。
  # Serverless の layers で管理すると、Layer を差し替えるたびに
  # 集約サーバーのデプロイを伴うことになる。
  #
  # ただし関数が参照するのは、デプロイ時に固定された Layer バージョンの
  # ARN である。7.3 の再ビルドで新しい Layer を発行しても、それだけでは
  # 実行中の関数は古い Layer を使い続ける。
  # 再ビルドのワークフローには、発行のあと UpdateFunctionConfiguration で
  # 新しい ARN と YTDLP_LAYER_VERSION を関数へ反映する手順が要る。
  ytdlpLayerArn: ${env:YTDLP_LAYER_ARN}

  scripts:
    hooks:
      # sls deploy / sls package 時に bootstrap を静的ビルドする（仕様書 5.1）。
      #
      # macOS / Apple Silicon でも Lambda(provided.al2023, arm64) 互換の
      # 静的バイナリを得るため、linux/arm64 を明示して Docker でビルドする。
      #
      # ベースイメージは musl の Alpine を使う。glibc を静的リンクした
      # バイナリは provided.al2023 上で外部 HTTPS が失敗する。
      # これは参考リポジトリ（limit7412/github_notifications_slack）で
      # 実証済みの構成をそのまま踏襲している。
      #
      # 完全静的リンクには OpenSSL/zlib/libevent の静的ライブラリ(.a)が要る。
      # 現行イメージには同梱されているが、将来外れてもリンクエラーに
      # ならないよう apk add で明示的に入れておく。
      #
      # 作業ディレクトリは backend/ で、成果物はリポジトリ直下へ出す。
      # provided ランタイムが実行するのは zip 直下の bootstrap であり、
      # backend/bootstrap のままでは見つけられない。
      #
      # chmod はコンテナ内(root)で実行する。Linux では生成物が root 所有に
      # なり、コンテナ外の実行ユーザーでは chmod できない。
      #
      # イメージのタグは backend/shard.yml と backend-ci.yml の Crystal に
      # 揃えて固定する。latest のままだと、CI が検証したのと違うコンパイラで
      # 本番の成果物が作られてしまう。
      'before:package:createDeploymentArtifacts': |
        docker run --rm --platform linux/arm64 -v "$PWD":/work -w /work/backend crystallang/crystal:1.21.0-alpine \
          sh -c "apk add --no-cache openssl-libs-static zlib-static libevent-static && crystal build --link-flags -static -o ../bootstrap src/main.cr && chmod +x ../bootstrap"

provider:
  name: aws
  runtime: provided.al2023
  architecture: arm64
  memorySize: 512
  timeout: 40
  region: ap-northeast-1
  stage: ${opt:stage, self:custom.defaultStage}
  environment:
    ${file(./env.yml)}

package:
  patterns:
    - '!./**'
    - bootstrap

functions:
  refresh:
    # provided ランタイムが実行するのはパッケージ直下の bootstrap で、
    # この文字列は _HANDLER として渡される。
    # backend/src/main.cr のハンドラ登録名と一致させること。
    handler: refresh
    layers:
      - ${self:custom.ytdlpLayerArn}
    events:
      # 60 秒間隔で起動する（仕様書 5.1）。
      # EventBridge Scheduler を使う。最小間隔が 1 分で仕様と一致する。
      - schedule:
          rate:
            - rate(1 minute)
          method: scheduler
