name: infra ci

# デプロイ定義（infra/ と infra/oidc/）の型検査を実行する。
#
# infra/ に触れていない変更では型検査をスキップする。
# 判定は `on` の `paths` フィルタではなく `changes` ジョブと `if` で行う
# （理由は .github/actions/changed-paths/action.yml に記述）。
#
# pulumi preview はここでは走らせない。AWS と Cloudflare の資格情報が要り、
# 差分を見るだけでも実在のアカウントへ触れることになる。型検査までを CI に置き、
# preview は手元かデプロイのワークフローで行う。

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  # 変更ファイルの一覧を Pull Requests API から取得するために必要
  pull-requests: read

jobs:
  # 変更が対象に触れているかを判定する。判定の中身と、`on` の `paths` を
  # 使わない理由は .github/actions/changed-paths/action.yml に書いてある。
  changes:
    name: Check changed paths
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      # 共有アクションはリポジトリの中にあるので、先に取ってこないと使えない
      - uses: actions/checkout@v7

      - id: check
        uses: ./.github/actions/changed-paths
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          label: infra の型検査
          patterns: |
            infra/*
            .github/workflows/infra-ci.yml
            .github/actions/changed-paths/*

  check:
    name: typecheck
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v4
        with:
          # Pulumi の nodejs ランタイムが対応する LTS に合わせる。
          node-version: 22
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            infra/oidc/package-lock.json

      # ci にするのは package-lock.json のとおりに入れるため。
      # install だと lock を書き換えてしまい、検証した組み合わせと変わる。
      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      # infra/oidc/ は独立した Pulumi プロジェクトで、依存も lock も別に持つ。
      # ジョブを分けないのは、名前の変わったチェックランが
      # required status check の指定から外れてしまうためである。
      - name: install (oidc)
        run: npm ci
        working-directory: infra/oidc

      - name: typecheck (oidc)
        run: npm run typecheck
        working-directory: infra/oidc
