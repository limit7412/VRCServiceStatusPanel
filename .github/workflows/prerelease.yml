name: prerelease

# master への取り込みを契機に、VPM のプレリリース（test 版）を作る（仕様書 9.2）。
#
# 版は最新の安定版タグ X.Y.Z からパッチを一つ上げた X.Y.(Z+1) に、
# プレリリース番号を付けた X.Y.(Z+1)-testN とする。
# 同じ次期バージョンの -testN が既にあれば N を一つ進める。
# パッチ以外を上げたいプレリリースは手で作り、以後はその系列を継ぐ
# （.github/scripts/next-prerelease-version.sh、docs/release.md）。
# 安定版タグが一つも無いあいだは、最初の安定版に決めた 0.1.0 を次期バージョンとして
# 0.1.0-testN を作る。0.1.0 が打たれたら、この値は使われなくなる。
#
# zip の添付とリスティングへの通知は、release.yml に任せずここで行う。
# GITHUB_TOKEN で作ったリリースは、ワークフローの連鎖起動を防ぐ GitHub Actions の
# 仕様により release イベントを発火させず、release.yml はここで作ったものに対して
# 動かないためである。
#
# パッケージの中身に触れた取り込みだけで作る。判定は `on` の `paths` ではなく
# changes ジョブで行い、判定できなかったときは作る側へ倒す
# （理由は .github/actions/changed-paths/action.yml）。
#
# dev デプロイ（deploy-dev.yml）とは needs で繋がない。
# 繋ぐと、dev デプロイが落ちた日にプレリリースも作られなくなる。

on:
  push:
    branches: [master]
  # タグの計算からやり直したいときや、手順を変えて作り直したいときに手で流す
  workflow_dispatch:

permissions:
  contents: read

env:
  # 安定版タグが無いあいだの次期バージョン（仕様書 9.2）
  FIRST_VERSION: 0.1.0

jobs:
  # 変更が zip に入るものに触れているかを判定する。判定の中身と、`on` の `paths` を
  # 使わない理由は .github/actions/changed-paths/action.yml に書いてある。
  changes:
    name: Check changed paths
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      # 共有アクションはリポジトリの中にあるので、先に取ってこないと使えない
      - uses: actions/checkout@v7

      - id: check
        uses: ./.github/actions/changed-paths
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          label: プレリリースの作成
          # zip へ実際に入るものだけを並べる。.github/scripts/build-package.sh が
          # 固める中身と揃えること。ずれると、中身の同じプレリリースが増えるか、
          # 逆に中身が変わったのに作られないかのどちらかが起きる。
          #
          # Tests/ は zip に入らないので対象外。
          # このワークフロー自身とスクリプトも対象に含めない。手順の変更で zip の中身が
          # 変わることはあるが、その頻度でプレリリースを積むより、作り直したいときに
          # workflow_dispatch から流すほうが扱いやすい。
          patterns: |
            unity/Packages/com.qazx7412.vrcservicestatuspanel/package.json
            unity/Packages/com.qazx7412.vrcservicestatuspanel/package.json.meta
            unity/Packages/com.qazx7412.vrcservicestatuspanel/Runtime/*
            unity/Packages/com.qazx7412.vrcservicestatuspanel/Runtime.meta
            unity/Packages/com.qazx7412.vrcservicestatuspanel/Editor/*
            unity/Packages/com.qazx7412.vrcservicestatuspanel/Editor.meta

  prerelease:
    name: create pre-release
    needs: changes
    # 判定そのものが失敗したときは作る。
    # 飛ばす条件を「対象に触れていない」に限らないと、判定が壊れているあいだ
    # 試せるはずの変更が master に入ったままになる。
    # !cancelled() を置くのは、これが無いと needs の失敗でジョブごと
    # 飛ばされ、if を読んでもらえないためである。
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      # タグとリリースを作る
      contents: write
      # この実行の artifact の一覧と取得（再実行の記録）、release.yml の実行の状態
      actions: read
    outputs:
      # 公開の直前に読み直した版があればそれ、無ければ最初に決めた版（下の re-check）
      version: ${{ steps.final.outputs.version || steps.version.outputs.version }}
    # 取り込みが続いたときにタグの計算が競合しないよう、直列にする。
    # 並んで走ると両方が同じ -testN を計算し、片方のタグ作成が失敗する。
    #
    # ワークフロー全体ではなくこのジョブに効かせる。全体に効かせると、中身を変えない
    # push も群を占め、待機中の「中身が変わる」実行を取り消したうえで何も作らずに終わる。
    #
    # 待機できる実行は一件に限られ、取り込みが続けて三件以上あると、中間の実行は取り消される。
    # 群の中の順序は保証されず、先の push の実行が後から走ることもある。
    # どの実行も、走った時点の master の先端から作るので（下の checkout）、どちらでも
    # 最新の内容は作られ、古い内容が後から積まれることはない。
    # 目的は取り込みごとに一つ作ることではなく master の最新を試せるようにすることなので、
    # これは許容する（仕様書 9.2）。
    concurrency:
      group: prerelease
      cancel-in-progress: false
    steps:
      # 起動時のコミットではなく、走った時点の master の先端を取る。
      # 起動時のコミットで作ると、順序が入れ替わったときに、後の push の内容を出した後で
      # 古い内容のプレリリースが最大の版として積まれる。
      # 手で流したときも同じで、どの ref を選んでも master の先端から作る。
      # 別のブランチを選んで master に無い内容を公開する経路が、これで無くなる。
      # 版をタグの一覧から決めるので、履歴とタグをすべて取る
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      # 再実行（run_attempt が 2 以上）のときは、前の試行が記録したコミットを取る。
      # 記録は下の record the target が同じ実行の artifact に置く。artifact は実行に
      # 属し、試行をまたいで残る。
      # まず一覧で有無を見る。無いのは前の試行が記録する前に落ちた場合で、それは
      # 初回と同じに進む。一覧や取得そのものが失敗したときは止める。
      # 失敗も無いことにして進むと、記録したコミットのタグに zip が無いまま新しい版が作られる
      - name: restore the target recorded by the previous attempt
        if: ${{ fromJSON(github.run_attempt) > 1 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          COUNT=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?name=prerelease-version" \
            --jq '[.artifacts[] | select(.expired | not)] | length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::notice::前の試行は版を記録する前に落ちている。初回と同じに先端から決める"
            exit 0
          fi
          gh run download "$GITHUB_RUN_ID" -n prerelease-version -D "$RUNNER_TEMP/prerelease-version"
          echo "前の試行の記録（コミット）: $(cat "$RUNNER_TEMP/prerelease-version/target.txt")"

      # 版を決め、リリースに zip が付いているかを見る。
      #
      # まず、再実行のときは、前の試行が記録したコミットにプレリリースのタグがあれば、
      # zip の有無にかかわらずその版を続ける。記録するのはコミットだけで、版は記録しない。
      # 版は公開の直前に決め直すことがあり（下の re-check）、記録した版とタグが食い違う。
      # 初回の実行はその時点の先端にタグを打つので、再実行までに master が進んでいると、
      # 先端だけを見るとそのタグは見つからず、資材の無いリリースが残るか、通知だけを
      # 再試行できずに別の版が作られる。続けるときはそのコミットを checkout し、zip が
      # 無ければタグの内容から作る。
      # 起動時のコミットから先端までのタグを探す形にはしない。前の試行が作ったタグの後に
      # 別の実行が次の版を公開していると、その範囲には両方が入り、無関係な新しい版を
      # 選んで、前の試行の版が欠けたまま残る。
      # 記録したコミットにタグが無ければ、前の試行はタグを作る前に落ちている。
      # 続けるものが無いので、初回と同じに先端から決める。
      # 別の実行が同じコミットにタグを打つことは無い。この実行は先端に打ち、同じ先端への
      # 実行は concurrency で直列になり、先端に既にタグがあれば新しい版を作らない。
      # 初回の実行では見ない。手で流すときは任意の ref を選べるので、過去のタグを ref に選ぶだけで
      # 古い内容が公開される経路になる。
      #
      # それが無ければ、先端に既にプレリリースのタグがあればその版をそのまま使い、
      # 新しい版は作らない。先端を作った実行の後に古い push の実行が走ったとき、
      # 同じ中身を二度積まないためである。
      # タグがあることを完了とは見なさず、zip がリリースに付いていなければ作って付け、
      # 通知は毎回行う（通知は何度送っても同じ）。
      #
      # 次の版の計算には、パッケージの zip（<パッケージ名>-<タグ>.zip）が付いたリリースの
      # あるタグだけを渡す。master の過去のコミットに打って公開を拒まれたタグを起点にしない。
      # 別のファイルを手で添付したリリースも、パッケージの zip が無ければ数えない。
      # 人が公開したリリース（正式版と、手で始めた系列の X.Y.Z-testN）の zip は release.yml が
      # 公開の後で付けるので、付くまでは待ってから一覧を作る（published-tags.sh）。
      # 待たないと、そのリリースより古い版を出す。
      - name: determine version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TIP=$(git rev-parse HEAD)
          NUM='(0|[1-9][0-9]*)'
          PATTERN="^$NUM\.$NUM\.$NUM-test[1-9][0-9]*\$"
          PACKAGE_NAME=$(jq -r '.name' unity/Packages/com.qazx7412.vrcservicestatuspanel/package.json)

          # プレリリースとして公開されたリリースに zip が付いているか。
          # リリースそのものが無ければ view が失敗し、無いと数える。
          # 下書きは書き込み権限のトークンだと view が返すが、公開されていないので数えない。
          # 数えると、下書きのまま作成を飛ばして通知だけが走る
          has_asset() {
            gh release view "$1" --json isDraft,isPrerelease,assets \
              --jq 'select((.isDraft | not) and .isPrerelease) | .assets[].name' 2>/dev/null \
              | grep -qxF "${PACKAGE_NAME}-$1.zip"
          }

          # 記録は「コミット」か「コミット タグ」。タグは打った後に記録し直す（下の re-record）。
          # タグの記録があればそれだけを続ける。同じコミットに別のタグ（手で打った次の系列など）が
          # あっても、それを前の試行のものと取り違えない。
          # タグの記録が無いのは、前の試行がタグを打つ前か、打った直後の記録し直しの前に落ちた場合。
          # そのコミットのタグが一つならそれを続け、無ければ先端から決め、二つ以上なら
          # どれが前の試行のものか分からないので止める
          RESUME=""
          RECORD="$RUNNER_TEMP/prerelease-version/target.txt"
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ] && [ -f "$RECORD" ]; then
            read -r RECORDED_SHA RECORDED_TAG < "$RECORD"
            if ! git merge-base --is-ancestor "$RECORDED_SHA" HEAD; then
              echo "::error::再実行。前の試行が記録したコミット $RECORDED_SHA が master に無い" >&2
              exit 1
            fi
            if [ -n "$RECORDED_TAG" ]; then
              if [ "$(git rev-list -n 1 "refs/tags/$RECORDED_TAG" 2>/dev/null || true)" = "$RECORDED_SHA" ]; then
                RESUME="$RECORDED_TAG"
              else
                echo "::notice::再実行。前の試行はタグ $RECORDED_TAG（コミット $RECORDED_SHA）を記録しているが、そのタグが無いか、別のコミットを指している。続けるものが無いので、先端から決める"
              fi
            else
              CANDIDATES=$(git tag --points-at "$RECORDED_SHA" | grep -E "$PATTERN" || true)
              case "$(printf '%s' "$CANDIDATES" | grep -c .)" in
                0) echo "::notice::再実行。前の試行はコミット $RECORDED_SHA を記録しているが、そこにプレリリースのタグが無い。タグを打つ前に落ちているので、先端から決める" ;;
                1) RESUME="$CANDIDATES" ;;
                *)
                  echo "::error::再実行。前の試行が記録したコミット $RECORDED_SHA に複数のプレリリースのタグ（$(echo "$CANDIDATES" | tr '\n' ' ')）があり、どれを続けるか決められない。前の試行のタグを確かめ、他を消すか、そのタグに zip を手で付ける" >&2
                  exit 1
                  ;;
              esac
            fi
          fi

          if [ -n "$RESUME" ]; then
            MODE=resume
            VERSION="$RESUME"
            TARGET="$RECORDED_SHA"
            git checkout -q "$TARGET"
            echo "::notice::再実行。前の試行が作ったプレリリース $VERSION のタグ（$TARGET）がある。新しい版は作らず、そのタグの続きを行う"
          else
            TARGET="$TIP"
            EXISTING=$(git tag --points-at HEAD | grep -E "$PATTERN" | sort -V | tail -n 1 || true)
            if [ -n "$EXISTING" ]; then
              MODE=existing
              VERSION="$EXISTING"
              echo "::notice::master の先端 $TIP には既にプレリリース $VERSION のタグがある。新しい版は作らず、足りないものだけを続ける"
            else
              MODE=new
              .github/scripts/published-tags.sh "$PACKAGE_NAME" "$RUNNER_TEMP/published-tags.txt"
              VERSION=$(.github/scripts/next-prerelease-version.sh "$FIRST_VERSION" "$RUNNER_TEMP/published-tags.txt")
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION（コミット $TARGET、$MODE）"

          if has_asset "$VERSION"; then
            echo "has_asset=true" >> "$GITHUB_OUTPUT"
            echo "リリース $VERSION には zip が付いている。作り直さない"
          else
            echo "has_asset=false" >> "$GITHUB_OUTPUT"
          fi

      # 出すコミットを、この実行の artifact に記録する。再実行はこれを読んで、そこに
      # 打たれたタグの続きを行う（上の restore）。タグを作る前に置くのは、タグを作った直後の
      # 添付で落ちたときも拾うため。タグを作る前に落ちていれば、再実行はタグが無いことで見分ける。
      # タグが既に決まっている（resume、existing）ならタグ名も添える。新しく打つ場合は
      # 打った後に記録し直す（下の re-record）。再実行も同じ名前で置き直すので、上書きを許す
      - name: record the target for re-runs
        env:
          SHA: ${{ steps.version.outputs.sha }}
          MODE: ${{ steps.version.outputs.mode }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prerelease-version"
          if [ "$MODE" = new ]; then
            echo "$SHA" > "$RUNNER_TEMP/prerelease-version/target.txt"
          else
            echo "$SHA $VERSION" > "$RUNNER_TEMP/prerelease-version/target.txt"
          fi

      - name: upload the record
        uses: actions/upload-artifact@v7
        with:
          name: prerelease-version
          path: ${{ runner.temp }}/prerelease-version/target.txt
          overwrite: true

      # release.yml も同じスクリプトを呼ぶので、プレリリースと正式版で中身が食い違わない
      - name: build package
        if: steps.version.outputs.has_asset != 'true'
        run: .github/scripts/build-package.sh "${{ steps.version.outputs.version }}"

      # 新しく決めた版は、公開済みのタグからもう一度決め直し、そのままタグを打って push する。
      # 決めてから zip を作るまでのあいだに正式版 X.Y.Z が公開されると、決めた X.Y.Z-testN は
      # その正式版より古く、公開すると利用者に新しい test 版として取れない。
      # 決め直しとタグの作成を一つのステップに置き、そのあいだに他のステップを挟まない。
      # 打った後にもう一度決め直し（自分のタグは手元から外して）、同じ版が出れば確定する。
      # 違えば、そのあいだに正式版が公開されている。打ったタグを消して、決め直した版でやり直す。
      # タグを作れば版は確定し、下の create pre-release はそのタグにリリースと zip を付けるだけになる。
      # 続きを行う版（resume、existing）はタグが既にあるので、決め直さない
      - name: settle the version and create the tag
        id: final
        if: steps.version.outputs.has_asset != 'true' && steps.version.outputs.mode == 'new'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(jq -r '.name' unity/Packages/com.qazx7412.vrcservicestatuspanel/package.json)

          # 採番は手元のタグとリリースの一覧を突き合わせる。checkout の後に打たれたタグ
          # （同じコミットへの正式版など）は手元に無いので、一覧に入っていても数えられない。
          # 決め直す前にタグを取り直す。
          # 第一引数に自分が打ったタグを渡すと、取り直した後にそれを手元から外して決める。
          # 外さないと、番号の重複を避ける計算がそのタグを数え、必ず次の番号が出る
          decide() {
            git fetch --no-recurse-submodules origin '+refs/tags/*:refs/tags/*'
            if [ -n "${1:-}" ]; then
              git tag -d "$1" >/dev/null
            fi
            .github/scripts/published-tags.sh "$PACKAGE_NAME" "$RUNNER_TEMP/published-tags.txt" >&2
            .github/scripts/next-prerelease-version.sh "$FIRST_VERSION" "$RUNNER_TEMP/published-tags.txt"
          }

          ATTEMPT=0
          while :; do
            ATTEMPT=$(( ATTEMPT + 1 ))
            LATEST=$(decide)
            if [ "$LATEST" != "$VERSION" ]; then
              echo "::notice::版を決めてから公開までのあいだに公開済みのタグが変わった。$VERSION ではなく $LATEST で作り直す"
              rm -f ./*.zip
              .github/scripts/build-package.sh "$LATEST"
              VERSION="$LATEST"
            fi

            # 決め直しの fetch で同じ名前のタグが手元に来ていることは無い（採番が使われていない
            # 番号を出す）が、来ていても止まらないよう -f で打ち、push の拒否で気づく
            git tag -f "$VERSION" "$SHA"
            if ! git push origin "refs/tags/$VERSION"; then
              # 同じ名前のタグが先に打たれている。取り直して決め直す
              git tag -d "$VERSION"
              if [ "$ATTEMPT" -ge 3 ]; then
                echo "::error::タグ $VERSION を push できない。三度決め直しても同じなので止める" >&2
                exit 1
              fi
              continue
            fi

            # 打った後にもう一度。自分のタグを手元から外して決め直し、同じなら確定
            CHECK=$(decide "$VERSION")
            if [ "$CHECK" = "$VERSION" ]; then
              break
            fi
            echo "::notice::タグ $VERSION を打つあいだに公開済みのタグが変わった（決め直すと $CHECK）。打ったタグを消してやり直す"
            git push origin ":refs/tags/$VERSION"
            if [ "$ATTEMPT" -ge 3 ]; then
              echo "::error::三度やり直しても版が定まらない。止める" >&2
              exit 1
            fi
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "タグ $VERSION をコミット $SHA に打った"
          echo "$SHA $VERSION" > "$RUNNER_TEMP/prerelease-version/target.txt"

      # 打ったタグの名前を記録し直す。再実行はこれで前の試行のタグを照合する（上の determine version）
      - name: re-record the target with the tag
        if: steps.version.outputs.has_asset != 'true' && steps.version.outputs.mode == 'new'
        uses: actions/upload-artifact@v7
        with:
          name: prerelease-version
          path: ${{ runner.temp }}/prerelease-version/target.txt
          overwrite: true

      # タグは上で打ってあるか（new）、既にある（resume、existing）。
      # このアクションはそのタグにリリースを作り、zip を付ける。リリースが既にあれば zip を足すだけで済ませる
      - name: create pre-release
        if: steps.version.outputs.has_asset != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.final.outputs.version || steps.version.outputs.version }}
          # タグは既にあるので使われないが、無かったときに既定ブランチの先端へ打たれないよう、
          # 出すコミットを明示しておく
          target_commitish: ${{ steps.version.outputs.sha }}
          prerelease: true
          generate_release_notes: true
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # secrets コンテキストはジョブの if で参照できないため、
  # トークンの有無を先行ジョブの出力へ移してから分岐する（unity-test.yml と同じ形）。
  # トークンを置く前でもプレリリース自体は作れるようにし、通知だけを飛ばす。
  listing-token:
    name: Check listing token
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          LISTING_DISPATCH_TOKEN: ${{ secrets.LISTING_DISPATCH_TOKEN }}
        run: |
          if [ -n "$LISTING_DISPATCH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::LISTING_DISPATCH_TOKEN が未設定のため VPM リスティングへの通知をスキップします"
          fi

  # プレリリースの公開を VPM リスティング（limit7412/vcc-vpm）へ通知し、
  # リスティングを作り直させる。
  # GitHub の release イベントはリリース元のリポジトリにしか配信されないので、
  # リスティング側から検知することはできない。
  #
  # needs に prerelease を置くのは zip の添付を待つため。リスティングの生成は
  # リリースの資材を参照するので、添付前に通知すると zip が無い状態で索引される。
  #
  # secret は inherit ではなく明示的に渡す。inherit は可変 ref（@main）で読み込まれる
  # 他リポジトリのワークフローへこのリポジトリの全 secret を渡すが、要るのは一つだけである。
  # LISTING_DISPATCH_TOKEN は vcc-vpm だけをスコープとし Contents の読み書きを持つ
  # fine-grained PAT（docs/release.md）。
  notify-listing:
    name: notify-listing
    needs: [prerelease, listing-token]
    if: ${{ !cancelled() && needs.prerelease.result == 'success' && needs.listing-token.outputs.available == 'true' }}
    # 呼ばれた再利用可能ワークフローは呼ぶ側の GITHUB_TOKEN を受け取る。
    # 通知は LISTING_DISPATCH_TOKEN で行われ GITHUB_TOKEN は使わないので、権限は全て落とす。
    permissions: {}
    uses: limit7412/vcc-vpm/.github/workflows/notify-listing.yml@main
    with:
      # 既定を持たない必須入力。uses: の参照先と同じリポジトリを指すこと
      listing-repo: limit7412/vcc-vpm
      # GITHUB_TOKEN で作ったリリースは release イベントを発火させないため、
      # 呼び出し先が既定で読む github.event.release.tag_name は空になる。
      # 作ったタグを明示的に渡す
      tag: ${{ needs.prerelease.outputs.version }}
    secrets:
      LISTING_DISPATCH_TOKEN: ${{ secrets.LISTING_DISPATCH_TOKEN }}
