name: deploy prod

# リリースの公開を契機に prod へ出す（仕様書 9.2）。
#
# 型は released だけにする。通常リリースの公開でも、プレリリースからの昇格でも
# 一度だけ発火し、プレリリースの公開では発火しない。
# published を並べると、通常リリースの公開で同じタグに二回動く。
# prerelease.yml が GITHUB_TOKEN で作るプレリリースは、release イベントそのものを
# 発火させない（GitHub Actions の連鎖防止）。
#
# 出す前に、タグが X.Y.Z の形で、指すコミットが master の先端であることを確かめる。
# master の先端以外に打たれたリリースは、dev で試していない内容を prod へ出すか、
# 過去の内容へ prod を巻き戻す。切り戻しは deploy.yml の手動起動で行う。
# 検査は release.yml と同じスクリプトで、パッケージの公開と prod へのデプロイで
# 通す条件が食い違わないようにしてある。
#
# deploy.yml のジョブは environment prod を参照し、OIDC の sub は environment の形になる。
# この environment をタグからも名乗れるよう、環境の deployment branches and tags の規則に
# X.Y.Z の形のタグを足してある（docs/release.md）。

on:
  release:
    types: [released]

permissions:
  contents: read

# 同じスタックへ二つ流さない。deploy.yml を手で prod へ流したときと同じ群である。
# 走っているものは止めない。途中で切ると state と実物がずれる。
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  verify:
    name: tag is on master
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: verify the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          # released はプレリリースでは発火しない。型の意味が変わっても
          # プレリリースを prod へ出さないよう、ここでも見る
          if [ "$PRERELEASE" = "true" ]; then
            echo "::error::プレリリース $TAG は prod へ出さない"
            exit 1
          fi

          # release イベントの GITHUB_SHA はタグが指すコミットである
          .github/scripts/verify-release-tag.sh "$TAG" "$GITHUB_SHA" stable

  deploy:
    name: deploy
    needs: verify
    # 呼ばれた側は、ここで渡した permissions から下げることしかできない。
    # deploy.yml が要る id-token: write をここで渡す。
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      stack: prod
    # 同じリポジトリの中の呼び出しなので inherit でよい
    secrets: inherit
