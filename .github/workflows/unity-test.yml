name: unity test

# ワールド側アセット（unity/）のEditModeテストをPRごとに実行する。
#
# 仕様書 10 のとおり、unity/ 自体が動作確認用の最小Unityプロジェクトであり、
# 配布単位の VPM パッケージはその Packages/ 配下にある。
# CI側でプロジェクトを組み立てる必要はなく、unity/ をそのまま使う。
# VPM依存（VRChat Worlds SDK）はUnity Package Managerでは解決できないため、
# vrc-getで先に入れてからテストランナーを回す。
#
# 実行にはUnityライセンスのsecret登録が必要。ライセンスの種類で使うsecretが違う:
#   Personal … UNITY_LICENSE（ライセンスファイル(.ulf)の中身）+ UNITY_EMAIL + UNITY_PASSWORD
#   Pro/Plus … UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD
# 取得手順は https://game.ci/docs/github/activation を参照。
# UNITY_LICENSEを登録するとそちらで認証するため、シリアルを使う場合は登録しない。
# どちらも未設定の場合、テストジョブはスキップされる（フォークからのPRを含む）。
#
# テスト対象に触れていない変更では、テストジョブをスキップする。
# 判定は`on`の`paths`フィルタではなく`changes`ジョブと`if`で行う
# （理由は .github/actions/changed-paths/action.yml に記述）。

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  # テスト結果をチェックランとしてPRへ出すために必要
  checks: write
  # 変更ファイルの一覧をPull Requests APIから取得するために必要
  pull-requests: read

env:
  # unity/ProjectSettings/ProjectVersion.txt と package.json の unity /
  # unityRelease に合わせる。変更する場合は unityci/editor に
  # ubuntu-<version>-base-3 タグが存在するか確認する
  UNITY_VERSION: 2022.3.22f1
  # テスト実行の対象アセンブリ。絞らないとVRChat SDKが同梱するEditModeテスト
  # （com.vrchat.worldsのTests.GraphNodeTestsなど）まで走り、こちらの変更と
  # 無関係な失敗でジョブが落ちる
  TEST_ASSEMBLY: VRCServiceStatusPanel.Editor.Tests
  VRC_GET_VERSION: v1.9.2

jobs:
  # secretsコンテキストはジョブの`if`で参照できないため、
  # ライセンスの有無を先行ジョブの出力へ移してから分岐する
  license:
    name: Check license secret
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UNITY_LICENSE / UNITY_SERIAL が未設定のためEditModeテストをスキップします"
          fi

  # 変更がテスト対象に触れているかを判定する。判定の中身と、`on` の `paths` を
  # 使わない理由は .github/actions/changed-paths/action.yml に書いてある。
  changes:
    name: Check changed paths
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      # 共有アクションはリポジトリの中にあるので、先に取ってこないと使えない
      - uses: actions/checkout@v7

      - id: check
        uses: ./.github/actions/changed-paths
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          label: EditMode テスト
          patterns: |
            unity/*
            .github/workflows/unity-test.yml
            .github/actions/changed-paths/*

  test:
    name: EditMode tests
    needs: [license, changes]
    if: needs.license.outputs.available == 'true' && needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install vrc-get
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/vrc-get" \
            "https://github.com/vrc-get/vrc-get/releases/download/$VRC_GET_VERSION/x86_64-unknown-linux-musl-vrc-get"
          chmod +x "$RUNNER_TEMP/bin/vrc-get"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/vrc-get" --version

      - name: Resolve VPM dependencies
        working-directory: unity
        run: |
          # VRChat公式のVPMリポジトリはvrc-getが既定で持つため、repo addは不要。
          # UdonSharpはcom.vrchat.worldsに含まれるので個別のinstallも要らない。
          vrc-get install com.vrchat.worlds --yes
          cat Packages/vpm-manifest.json

      - name: Cache Library
        uses: actions/cache@v6
        with:
          path: unity/Library
          key: Library-${{ env.UNITY_VERSION }}-${{ hashFiles('unity/Packages/vpm-manifest.json') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-

      # 他のアクションはNode 24を実行環境とする版へ上げているが、これはv4が最新であり
      # Node 20のまま。上流が新しいメジャーを出すまでは追随できない。
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          customParameters: -assemblyNames ${{ env.TEST_ASSEMBLY }}
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editmode-test-results
          path: artifacts
          if-no-files-found: warn
