# 集約サーバーへ渡す環境変数（仕様書 11.7）。
#
# 実体の env.yml は git 管理外にする。ここに書いた値はそのまま Lambda の
# 環境変数になるため、鍵をリポジトリへ入れないための措置である。
# CI では Secrets から env.yml を組み立てる。
#
# 使いはじめるときは、このファイルを env.yml へ複製して値を入れる。

# 実行環境の名前。ログやアラートの文面に出す
ENV: dev

# 配信先と内部バケット（仕様書 6）
R2_ENDPOINT: https://<accountid>.r2.cloudflarestorage.com
R2_PUBLIC_BUCKET: status-public
R2_STATE_BUCKET: status-state

# R2 のアクセスキー。S3 互換 API 用のトークンから得る。
#
# 権限は Object Read & Write を選び、対象を上の二つのバケットに絞る。
# 状態バケットには読み取りが要る。仕様書 5.2 の手順 4 が前回の状態を
# GET するためで、読めなければ合成監視の直近三回による判定も、
# 取得失敗時の前回値の引き継ぎも働かない。
#
# 仕様書 9 の「書き込みのみ」は R2 では実現できない。
# トークンに書き込みのみの段階はなく、選べるのは Admin Read & Write、
# Admin Read only、Object Read & Write、Object Read only である。
# しかも選んだ段階は対象のバケット全体へ一律に効くので、一組の鍵で
# 公開バケットだけを書き込み専用にすることもできない。
# バケットごとに権限を分けるならトークンを二つに分け、鍵も二組
# 受け取る形にする必要がある（#9）。
#
# 保存時の暗号化に自前の KMS 鍵を使う場合は、serverless.yml の
# provider.kmsKeyArn を指定する
R2_ACCESS_KEY_ID: ""
R2_SECRET_ACCESS_KEY: ""

# YouTube の合成監視に使う固定動画（仕様書 3.3）。
# 作者自身のチャンネルの公開動画とし、上流の都合で消えないようにする
YOUTUBE_PROBE_VIDEO_ID: ""

# BOOTH の合成監視に使う作者自身の公開商品（仕様書 3.3）
BOOTH_PROBE_ITEM_ID: ""

# Layer に載せた yt-dlp の版（仕様書 7.3）。
# VRChat の /config が返す youtubedl_version と実行時に比べる。
# Layer を発行し直したらここも合わせる
YTDLP_LAYER_VERSION: ""

# 版が食い違ったときに Layer の再ビルドを起動するためのトークン（仕様書 7.3）
GITHUB_DISPATCH_TOKEN: ""

# 失敗時のアラート送信先（仕様書 11.2 の error/usecase.cr）
ALERT_WEBHOOK_URL: ""
