name: vrc-service-status-panel
runtime:
  name: nodejs
  options:
    packagemanager: npm
description: 集約サーバー（Lambda）と配信経路（R2）の定義

# 値はスタックごとの Pulumi.<スタック名>.yaml に入れる。
# 雛形は Pulumi.example.yaml にある。
config:
  cloudflareAccountId:
    type: string
    description: Cloudflare のアカウント ID。R2 のエンドポイントにも使う
  deliveryZoneId:
    type: string
    description: 配信ドメインが属するゾーンの ID。Cache Rules を入れる先
  deliveryHost:
    type: string
    description: 配信ホスト名。Cache Rules の条件に使う（仕様書 6）
  publicBucket:
    type: string
    default: ""
    description: 配信バケット名。空ならスタック名から status-public-<スタック名>
  stateBucket:
    type: string
    default: ""
    description: 内部バケット名。空ならスタック名から status-state-<スタック名>
  bucketLocation:
    type: string
    description: バケットの置き場所のヒント。日本向けなので既定は apac
    default: apac
  ytdlpLayerArn:
    type: string
    description: yt-dlp と QuickJS を載せた Layer のバージョン ARN（仕様書 7.1）
  ytdlpLayerVersion:
    type: string
    description: 上の Layer に入れた yt-dlp の版。/config の値と比べる（仕様書 7.3）
  youtubeProbeVideoId:
    type: string
    description: 合成監視に使う固定動画（仕様書 3.3）
  boothProbeItemId:
    type: string
    description: 合成監視に使う作者自身の公開商品（仕様書 3.3）
  githubDispatchToken:
    type: string
    secret: true
    description: 版が食い違ったとき Layer の再ビルドを起動する（仕様書 7.3）
  alertWebhookUrl:
    type: string
    secret: true
    description: 失敗時のアラート送信先（仕様書 11.2）
  # ここから下は任意。既定値を置いてあるのは、宣言した設定に既定が無いと
  # 未設定のときに pulumi が止まるためである。空文字を未設定として扱う。
  workloadBoundaryArn:
    type: string
    default: ""
    description: |
      実行時ロールに付ける権限境界の ARN。infra/oidc/ の出力を入れる。
      手元からしかデプロイしないなら空でよい
