# スタックごとの値の雛形。
#
# 使いはじめるときは infra/init-stack.sh が Pulumi.<スタック名>.yaml を作る。
# 本体と同じ名前のスタックを両方に作るので、こちらだけを別に用意しなくてよい。
# 出来上がったファイルは commit する。
#
#   # パスフレーズは覚えずに作る。設定ファイルは commit され、このリポジトリは
#   # public なので、暗号文は誰でも総当たりを試せる状態に置かれる（#24）
#   #   openssl rand -base64 32
#   # 値を export の右辺に書かない。シェルの履歴に平文で残る
#   # read の -p は zsh では別の意味になるので、プロンプトは printf で出す
#   printf 'PULUMI_CONFIG_PASSPHRASE: '
#   read -rs PULUMI_CONFIG_PASSPHRASE && echo
#   export PULUMI_CONFIG_PASSPHRASE
#   infra/init-stack.sh dev
#
# 手で入れる場合は次の形になる。
#
#   pulumi stack init dev
#   pulumi config set githubRepository limit7412/VRCServiceStatusPanel

config:
  # 本体と同じリージョンにする（仕様書 5.1）
  aws:region: ap-northeast-1

  # デプロイを許すリポジトリ
  vrc-service-status-panel-oidc:githubRepository: limit7412/VRCServiceStatusPanel

  # 本体スタックと名前を揃えて運用するなら書かなくてよい
  # vrc-service-status-panel-oidc:targetStack: dev

  # アカウントに既に GitHub の OIDC プロバイダがあるならその ARN。
  # 無ければ書かない（新しく作る）
  # vrc-service-status-panel-oidc:githubOidcProviderArn: ""

  # ロールを引ける JWT の sub。省略すると master への push のみ
  # vrc-service-status-panel-oidc:githubDeploySubjects:
  #   - repo:limit7412/VRCServiceStatusPanel:ref:refs/heads/master
