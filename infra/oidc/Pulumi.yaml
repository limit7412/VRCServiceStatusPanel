name: vrc-service-status-panel-oidc
runtime:
  name: nodejs
  options:
    packagemanager: npm
description: GitHub Actions の入口と実行時ロールの上限。手元からだけ流す

# 状態の置き場所。ここで固定するのは、バックエンドがスタックより先に
# 決まるためである。Pulumi.<スタック名>.yaml の設定は、バックエンドが
# 決まってからでないと読めないので、置き場所を書く先にはならない。
#
# 手元でも CI でも pulumi login は要らない。要るのは R2 の鍵だけで、
# それは AWS_ACCESS_KEY_ID と AWS_SECRET_ACCESS_KEY から読まれる。
#
# エンドポイントのホスト名に入っているのは Cloudflare のアカウント ID で、
# Pulumi.<スタック名>.yaml の cloudflareAccountId と同じ値である。
backend:
  url: s3://qazx7412-vrc-service-status-panel-pulumi-state?endpoint=https://32cd31ff8a5c721c0583f57a83cb731e.r2.cloudflarestorage.com&s3ForcePathStyle=true&region=auto

# 値はスタックごとの Pulumi.<スタック名>.yaml に入れる。
# 雛形は Pulumi.example.yaml にある。
config:
  githubRepository:
    type: string
    description: デプロイを許すリポジトリ（owner/repo）
  # ここから下は任意。既定値を置いてあるのは、宣言した設定に既定が無いと
  # 未設定のときに pulumi が止まるためである。空文字を未設定として扱う。
  targetStack:
    type: string
    default: ""
    description: |
      権限を渡す相手の本体スタック名。
      空ならこのスタックと同じ名前を使う
  githubOidcProviderArn:
    type: string
    default: ""
    description: |
      既にアカウントへ置いてある GitHub の OIDC プロバイダの ARN。
      空なら新しく作る。プロバイダはアカウントに一つしか置けない
  githubDeploySubjects:
    type: array
    items:
      type: string
    default: []
    description: |
      ロールを引ける JWT の sub。空なら master への push のみ。
      例: repo:owner/repo:ref:refs/heads/master
